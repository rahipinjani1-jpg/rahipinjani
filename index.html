      <h1>Rahi Pinjani - Fashion Designer, Mumbai</h1>
      <p>Rahi Pinjani is a Mumbai-based fashion designer and creative maker. She crafts wearable stories from discarded cloth, bent wire, and hand-applied paint — a designer who thinks with her hands and finishes with intention.</p>
      <p>Her work draws heavily from the Indian textile tradition: block-printed cottons, kantha fabrics, organic forms, all reinterpreted through a contemporary lens. Whether repurposing leftover fabric into architectural soft furnishings, sculpting silver-tone wire into wearable forms, or painting botanicals directly onto handmade tops, Rahi's designs are always process-led and deeply personal.</p>
      <h2>Selected Projects</h2>
      <ul>
        <li><strong>Kathedar</strong> - Patchwork Curtain from Reclaimed Fabric. Textile Design, Upcycling. Mumbai, 2024.</li>
        <li><strong>Taar</strong> - Wire Jewellery and Accessory Collection. Avant-Garde Accessories, Wearable Art. Mumbai, 2024.</li>
        <li><strong>Khilna</strong> - Painted Botanical Tops. Surface Design, Garment Making. Mumbai, 2024.</li>
        <li><strong>Gulab</strong> - Block-Printed Kurti Collection. Indian Craft, Print Design. Mumbai, 2024.</li>
        <li><strong>Reshmi</strong> - Handcrafted Lehenga with Kantha Embroidery. Bridal, Embroidery. Mumbai, 2024.</li>
        <li><strong>Raat</strong> - Structured Velvet Silhouettes. Garment Design, Drape. Mumbai, 2024.</li>
        <li><strong>Navrang</strong> - Navratri Festive Collection. Festive Wear, Colour. Mumbai, 2024.</li>
        <li><strong>Misty Rose</strong> - Tailored Suit Collection. Tailoring, Structure. Mumbai, 2024.</li>
        <li><strong>Khushi</strong> - Everyday Organic Cotton Wear. Soft, Everyday. Mumbai, 2024.</li>
      </ul>
      <p>Based in Mumbai, India. View the full portfolio at rahipinjani.vercel.app</p>
